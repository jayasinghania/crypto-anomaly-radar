services:
  db:
    image: postgres:16
    container_name: crypto_pulse_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: crypto_pulse
      POSTGRES_PASSWORD: crypto_pulse
      POSTGRES_DB: crypto_pulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto_pulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: crypto_pulse_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: